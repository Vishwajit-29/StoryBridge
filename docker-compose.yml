version: '3.8'

services:
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: storybridge-ai-engine
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-your_nvidia_nim_api_key_here}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL_NAME=${NIM_MODEL_NAME:-google/diffusiongemma-26b-a4b-it}
      - AI_ENGINE_HOST=0.0.0.0
      - AI_ENGINE_PORT=8000
    volumes:
      - ./storage/artifacts:/app/storage/artifacts
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storybridge-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - STORYBRIDGE_AI_ENGINE_BASE_URL=http://ai-engine:8000
      - STORYBRIDGE_STORAGE_BASE_PATH=/app/storage/artifacts
      - JWT_SECRET=${JWT_SECRET:-storybridge_super_secret_jwt_key_that_is_at_least_256_bits_long_2026}
    volumes:
      - ./storage/artifacts:/app/storage/artifacts
    depends_on:
      - ai-engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storybridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: storybridge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storybridge}
      POSTGRES_USER: ${POSTGRES_USER:-storybridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storybridge_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: storybridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: storybridge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
